name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.1", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "2.6.9"
          bundler-cache: true
      - run: bundle exec ruby -Ilib test/core_test.rb
      - run: bundle exec ruby -Ilib test/schema_exporter_test.rb
